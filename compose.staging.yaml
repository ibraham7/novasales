# Test copy of the app (feature/marketing-outbound) next to the live site, never replacing it.
# Own project name, container, port and env file, so `docker compose` here cannot touch novasales-web.
# Run: docker compose -p novasales-staging -f compose.staging.yaml --env-file .env.staging up -d --build
# See docs/staging.md.
name: novasales-staging

services:
  app:
    container_name: novasales-staging-web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env.staging}
        SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in .env.staging}
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # The minute ticker (campaigns, Meta events, push reminders) stays OFF on the test copy.
      CAMPAIGN_AUTO_TICK: "0"
    ports:
      - "127.0.0.1:18082:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
